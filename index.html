<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Compliance Policy Writer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📄 Compliance Policy Writer</h1><p>Generate a policy skeleton for your framework.</p><label>Framework <select id="f"><option>SOC 2</option><option>ISO 27001</option><option>LGPD/GDPR</option></select></label><label>Policy area <select id="a"><option>Access control</option><option>Incident response</option><option>Data retention</option><option>Vendor management</option></select></label><button onclick="go()">Generate</button><div id="out"></div><script>function go(){const f=document.getElementById('f').value,a=document.getElementById('a').value;document.getElementById('out').textContent=`${f} — ${a} Policy (skeleton):\n\n1. Purpose & Scope\n2. Roles & Responsibilities\n3. ${a} requirements (mapped to ${f} controls)\n4. Monitoring & enforcement\n5. Exceptions process\n6. Review cadence: annual + on regulatory change\n\nFull auto-generated, audit-ready policy pack: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/compliance-policy-writer">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-compliance-monitor/">Compliance Monitor</a></p></body></html>
